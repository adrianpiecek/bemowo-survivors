<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Launched from the iPhone home screen: no Safari bars, real full screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bemowo Survivors</title>
  <style>
    /* dvh = the visible part of the screen, so Safari's toolbar no longer hides the bottom of the game */
    html, body { margin: 0; height: 100%; height: 100dvh; background: #000; overflow: hidden; touch-action: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #000; color: #fff;
      font: 24px sans-serif; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="rotate">Obróć telefon poziomo</div>
  <script src="./lib/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
